<!doctype html><html lang="ja"><meta charset="utf-8"><title>Sound Canvas 制作フロー確認</title>
<style>body{background:#10131b;color:#eaf3ff;font:16px sans-serif;padding:24px}button,input,a{margin:8px;padding:10px}pre{white-space:pre-wrap}canvas{max-height:360px;max-width:100%}.pass{color:#c2eca0}.fail{color:#ff9a9a}</style>
<h1>実音源と制作フロー</h1><p>選択した音源はこの端末内だけで処理します。保存する確認JSONには曲名・音源・曲固有の識別値を含めません。録画中はこのタブを表示したままにしてください。</p>
<label>検証用音源 <input id="files" type="file" accept=".mp3,.wav" multiple></label><label><input id="record" type="checkbox" checked>全曲WebMも確認（曲と同程度の時間）</label><button id="real">選択音源を検証</button><button id="fixtures">合成ケースを検証</button><a id="save" hidden download="release-metrics.json">確認データを保存</a>
<p id="status" role="status">未実行</p><div id="preview"></div><ol id="results"></ol><pre id="report"></pre><script type="module" src="release-browser.js"></script></html>
