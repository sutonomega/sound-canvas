<!doctype html><html lang="ja"><meta charset="utf-8"><title>Sound Canvas シーク性能の確認</title>
<style>body{background:#10131b;color:#eaf3ff;font:16px sans-serif;padding:24px}button,a{padding:12px;background:#d5f5a0;color:#10131b;border:0;border-radius:6px;margin-right:10px}.pass{color:#c2eca0}.fail{color:#ff9a9a}pre{white-space:pre-wrap}table{border-collapse:collapse}td,th{border:1px solid #364052;padding:8px}canvas{max-width:100%;height:auto}</style>
<h1>3分・5分のシークと保存状態の上限</h1><p>合成PCMの事前解析と実Canvasを使用。冒頭からの再計算と保存状態からの復元を比較します。音声時計は制御可能な代替です。保持量はCanvasのRGBAと状態の見積りです。</p>
<button id="run">シーク性能を検証</button><a id="save-image" hidden download="seek-comparison.png">比較PNGを保存</a><a id="save-report" hidden download="seek-metrics.json">確認データを保存</a><p id="summary">未実行</p><p id="progress"></p><div id="gallery"></div><ol id="results"></ol><pre id="report"></pre><script type="module" src="seek-browser.js"></script></html>
