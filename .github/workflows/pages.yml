name: Deploy Sound Canvas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/audio.js
          node --check dist/analysis.js
          node --check dist/controller.js
          node --check dist/renderer.js
          node --check dist/timing.js
          node --check dist/themes.js
          node --check dist/styles/index.js
          node --check dist/styles/organic.js
      - name: Check analysis, playback and rendering
        run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
